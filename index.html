<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080f1c"><title>Aqua Drift — 珊瑚礁</title><link rel="icon" href="fish.svg"><link rel="stylesheet" href="style.css?v=feed1"></head><body>
<header><div class="wrap bar"><h1 class="brand"><img src="fish.svg" alt="">Aqua Drift</h1><div class="clock"><i></i> <time id="clock">--:--</time></div></div></header>
<main class="wrap">
<div class="habitats" role="group" aria-label="水槽を選ぶ"><button data-habitat="reef" aria-pressed="true">珊瑚礁</button><button data-habitat="forest" aria-pressed="false">水草の森</button><button data-habitat="deep" aria-pressed="false">深海のクラゲ</button><button data-habitat="river" aria-pressed="false">渓流</button><button data-habitat="marsh" aria-pressed="false">沼</button><button data-habitat="pond" aria-pressed="false">池</button></div>
<section class="tank" id="tank" aria-label="水槽"><canvas id="ocean" role="button" tabindex="0" title="タップして餌をあげる" aria-label="水面から青い光が差し込む珊瑚礁を、色とりどりの魚が泳ぐドット絵。タップして餌をあげる"></canvas><div class="glass"><div class="viewtools"><button id="tank-bgm" type="button" aria-label="水槽のBGM" aria-pressed="false">♫ BGM OFF</button><button id="expand" title="水槽を全画面表示" aria-label="水槽を全画面表示"><svg viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5M4 15v5h5m11-5v5h-5"/></svg></button></div></div></section>
<section class="music" aria-label="BGMプレーヤー"><div class="module-title"><span>♫</span> BGM</div><div class="player"><div class="track"><canvas id="cover" width="48" height="48" aria-hidden="true"></canvas><div><h2 id="track"></h2><div class="genre" id="genre"></div></div></div><div class="transport"><button id="prev" title="前の曲" aria-label="前の曲">❮</button><button id="play" title="BGMを再生" aria-label="BGMを再生"></button><button id="next" title="次の曲" aria-label="次の曲">❯</button></div><div class="volume"><button id="mute" aria-label="消音" title="消音"><svg viewBox="0 0 24 24"><path d="M3 10h4l5-4v12l-5-4H3zm13-2q4 4 0 8m3-11q6 7 0 14"/></svg></button><input id="volume" type="range" min="0" max="100" value="45" aria-label="BGM音量"><output id="level">45%</output></div></div><p id="error" hidden role="alert"></p></section>
<section class="music ambience" aria-label="水槽の環境音"><div class="module-title"><span>≈</span> 水槽の環境音</div><div class="layers">
<div class="layer" data-sound="stream"><button type="button" aria-label="渓流のせせらぎを再生" aria-pressed="false"><span aria-hidden="true">▶</span><strong>渓流のせせらぎ</strong></button><input type="range" min="0" max="100" value="40" aria-label="渓流のせせらぎの音量"><output>40%</output></div>
<div class="layer" data-sound="bubbles"><button type="button" aria-label="エアポンプの泡音を再生" aria-pressed="false"><span aria-hidden="true">▶</span><strong>エアポンプの泡音</strong></button><input type="range" min="0" max="100" value="35" aria-label="エアポンプの泡音の音量"><output>35%</output></div>
</div><p id="ambient-error" hidden role="alert"></p></section>
</main><script src="reef.js?v=feed1"></script><script src="app.js?v=feed1"></script><script src="ambience.js?v=shore1"></script></body></html>
